# Everything that has to be true before main deploys itself.
#
# main auto-deploys to production on push, and the production build now applies migrations/*.sql
# before `next build` (package.json, scripts/migrate.mjs), so the SQL in this repository is no
# longer something a human applies by hand and can eyeball first. A migration that would fail, or
# that would fail the *second* time it ran, has to be caught here — on the pull request — because
# after the merge the next thing it meets is production.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector's image is the stock postgres:16 with the vector extension already built.
        # 0001_init.sql needs it: embeddings are vector(1024) and the search index is HNSW, so a
        # plain postgres:16 fails on the first file and this whole job would be theatre.
        # pg_trgm, unaccent and pgcrypto ship with contrib in the same image;
        # scripts/check-migrations.mjs creates all four in the scratch database itself.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Steps begin as soon as the container starts, which is a second or two before Postgres is
        # listening. Without the health check the first connection loses a race it did not know it
        # was in, and the failure looks like a broken migration rather than a slow container.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # check-comments diffs against the PR's merge base

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Only the comments this PR adds are judged, never a file's past. CLAUDE.md states the rule;
      # scripts/check-comments.mjs holds the limits and says where history goes instead.
      - name: Added comments are within limits
        if: github.event_name == 'pull_request'
        run: node scripts/check-comments.mjs origin/${{ github.base_ref }}

      # The check that would have caught 2026-09-10's whole class of problem. It executes the SQL
      # rather than parsing it, twice, against a real Postgres: a migration that is not idempotent
      # is valid SQL that applies cleanly the first time and errors the second, which in production
      # is a redeploy of the same commit — the moment you least want to find out.
      - name: Migrations are idempotent
        run: npm run check:migrations
        env:
          SCRATCH_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      # And the runner the production build now depends on. It has to apply the files, record them
      # in schema_migrations, take and release its advisory lock on the way, and then do nothing at
      # all when it runs again — that second run is what makes redeploying the same commit safe, and
      # it is worth asserting rather than assuming.
      - name: The migration runner applies, records, and repeats without repeating itself
        env:
          MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          npm run migrate
          npm run migrate | tee second-run.log
          grep -q "nothing to apply" second-run.log || {
            echo "The second run did not report an empty ledger, so schema_migrations is not being honoured."
            exit 1
          }

      # The planner has to keep choosing the partial vector index for the related-posts query once
      # the table is mostly expired rows — which production is, nine rows in ten. That is a decision
      # made against a real table, so it is checked against one: seeded at production's ratio, on
      # the schema the runner above just built. A regression here is the 2.5 s tail of CRI-56.
      - name: The related-posts query uses the live vector index
        env:
          SCRATCH_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: npm run check:live-index

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # both scan ranges below need the commits on each side

      # The CLI, not gitleaks/gitleaks-action, which refuses to run for an organization's
      # repository without a GITLEAKS_LICENSE. The checksum file comes from the same release, so
      # bumping GITLEAKS_VERSION is the whole upgrade.
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing --strict "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$tarball" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: No secrets in the commits this event adds
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -z "${PUSH_BEFORE//0/}" ]; then
            # An all-zero `before` means a first push, with no previous tip to diff from.
            range="-1 $PUSH_AFTER"
          else
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          gitleaks git --redact --no-banner --exit-code 1 --log-opts="$range" .
