# The next advisory opens its own pull request instead of waiting for someone to run `npm audit`.
# Production dependencies are grouped so one PR carries a whole week's bumps, and CI (typecheck,
# tests, the migration double-run) is what decides whether it merges.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    ignore:
      # TypeScript 7 drops the compiler API that Next 15.5's build uses.
      - dependency-name: typescript
        versions: [">=7"]
      # Track the Node major CI runs (22), not the newest one.
      - dependency-name: "@types/node"
        versions: [">=23"]
      # Next 16 and postgres 4 each need their own reviewed PR (CRI-72): revalidateTag takes a
      # second argument in 16, and postgres 4 changes parameter typing and rewrites the pool.
      - dependency-name: next
        versions: [">=16"]
      - dependency-name: postgres
        versions: [">=4"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
